name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 20

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skram
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: skram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://skram:testpassword@localhost:5432/skram_test
      BETTER_AUTH_SECRET: ci-test-secret
      BETTER_AUTH_URL: http://app.localhost.skrammm.com:3000
      NEXT_PUBLIC_APP_URL: http://app.localhost.skrammm.com:3000
      AWS_REGION: ap-southeast-1
      QR_HMAC_SECRET: ci-test-qr-secret
      PAYMENTS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Step 1: Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 2: Lint (module boundary rules)
      - name: Lint
        run: pnpm lint

      # Step 3: Typecheck
      - name: Typecheck
        run: pnpm typecheck

      # Step 4: Prisma generate + migrate on ephemeral Postgres
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run migrations (dry-run validation)
        run: pnpm db:migrate:deploy

      # Step 5: Seed test data then run unit tests
      - name: Seed database
        run: pnpm db:seed

      - name: Unit tests
        run: pnpm test:unit

      # Step 6: Build
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Step 7: E2E tests (critical paths only — on main branch)
      - name: Add test hostname to /etc/hosts
        if: github.ref == 'refs/heads/main'
        run: echo "127.0.0.1 app.localhost.skrammm.com" | sudo tee -a /etc/hosts

      - name: Install Playwright
        if: github.ref == 'refs/heads/main'
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        if: github.ref == 'refs/heads/main'
        run: pnpm test:e2e
        env:
          CI: true
          NODE_ENV: development

      # Step 8: Build Docker image (validates Dockerfile)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: skrammm:${{ github.sha }}
