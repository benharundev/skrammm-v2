name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]

env:
  PNPM_VERSION: 9.15.0
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/skrammm

jobs:
  deploy:
    name: Build → Push GHCR → Deploy VPS
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=https://app.skrammm.com
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to Shinjiru VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

            # Authenticate to GHCR to pull the private image
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull "$IMAGE"

            cd /opt/skrammm

            # Run migrations before swapping the container
            IMAGE="$IMAGE" docker compose run --rm nextjs node_modules/.bin/prisma migrate deploy

            # Swap to new image with zero-downtime restart
            IMAGE="$IMAGE" docker compose up -d nextjs

            sleep 10

            curl -sf http://localhost:3000/api/health || \
              (echo "Health check failed" && exit 1)

      - name: Verify deployment
        run: echo "Deployment complete. Health at ${{ secrets.APP_URL }}/api/health"
