name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]

env:
  PNPM_VERSION: 9.15.0
  GCP_REGION: asia-southeast1
  ARTIFACT_REGISTRY: asia-southeast1-docker.pkg.dev
  IMAGE_REPO: skrammm/app

jobs:
  deploy:
    name: Build → Push Artifact Registry → Deploy GCE
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACT_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_REPO }}:latest
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Deploy via SSH — Ansible provisions the key; GH secret holds the private key
      - name: Deploy to Compute Engine via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: ARTIFACT_REGISTRY,GCP_PROJECT_ID,IMAGE_REPO
          script: |
            IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_REPO }}:${{ github.sha }}"

            # Authenticate Docker to Artifact Registry using the VM's service account
            gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

            docker pull "$IMAGE"

            cd /opt/skrammm

            # Run migrations before swapping the container
            IMAGE="$IMAGE" docker compose run --rm nextjs node_modules/.bin/prisma migrate deploy

            # Swap to new image with zero-downtime restart
            IMAGE="$IMAGE" docker compose up -d nextjs

            sleep 10

            curl -sf http://localhost:3000/api/health || \
              (echo "Health check failed" && exit 1)

      - name: Verify deployment
        run: echo "Deployment complete. Health at ${{ secrets.APP_URL }}/api/health"
