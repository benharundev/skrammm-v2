name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]

env:
  PNPM_VERSION: 9.15.0
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/skrammm

jobs:
  deploy:
    name: Build → Push GHCR → Deploy VPS
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=https://app.skrammm.com
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to Shinjiru VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script: |
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

            # Authenticate to GHCR to pull the private image
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull "$IMAGE"

            cd /opt/skrammm

            # Persist image tag so systemd restarts after a VPS reboot use the correct version
            sed -i "s|^IMAGE=.*|IMAGE=$IMAGE|" .env
            grep -q "^IMAGE=" .env || echo "IMAGE=$IMAGE" >> .env

            # Recreate only the nextjs container — postgres and redis stay running
            # Migrations run automatically inside the container CMD before server starts
            IMAGE="$IMAGE" docker compose up -d --no-deps nextjs

            # Wait up to 2 minutes for health (12 × 10s)
            for i in $(seq 1 12); do
              curl -sf http://localhost:3000/api/health && break
              [ "$i" -eq 12 ] && echo "Health check failed after 120s" && exit 1
              sleep 10
            done

      - name: Verify deployment
        run: echo "Deployment complete. Health at ${{ secrets.APP_URL }}/api/health"
