worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------------------
    # OTP rate limiting (TECH_PRD §6.1 + §9.2)
    # ---------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=otp_ip:10m rate=5r/m;
    # Custom header set by Next.js server action: X-Email
    limit_req_zone $http_x_email zone=otp_email:10m rate=3r/m;

    # ---------------------------------------------------------------------------
    # Upstream: single Next.js instance (scale path adds more upstreams here)
    # ---------------------------------------------------------------------------
    upstream nextjs {
        server nextjs:3000;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name skrammm.com app.skrammm.com;

        # Cloudflare health check path — must respond on 80
        location /api/health {
            proxy_pass http://nextjs;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS — Cloudflare Origin Certificate (Full/Strict TLS)
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name skrammm.com app.skrammm.com;

        # Cloudflare Origin Certificate — long-lived, no renewal cron needed
        ssl_certificate     /etc/nginx/certs/cloudflare-origin.crt;
        ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # ---------------------------------------------------------------------------
        # SSE stream endpoint — must NOT buffer (TECH_PRD §7.4 + §9.2)
        # ---------------------------------------------------------------------------
        location ~ ^/api/stream/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            gzip off;
            add_header X-Accel-Buffering no;
            add_header Cache-Control "no-cache, no-store, no-transform";
        }

        # ---------------------------------------------------------------------------
        # OTP send endpoint — rate-limited per IP and per email
        # ---------------------------------------------------------------------------
        location ~ ^/api/auth/sign-in/email-otp {
            limit_req zone=otp_ip burst=2 nodelay;
            limit_req zone=otp_email burst=1 nodelay;
            limit_req_status 429;

            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------------
        # All other traffic → Next.js
        # ---------------------------------------------------------------------------
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
