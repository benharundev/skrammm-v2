# Production compose — Shinjiru KVM VPS (Ubuntu)
# Nginx runs natively on the host (via Ansible), not as a container.
# Postgres data lives on a dedicated disk mounted at /data/postgres.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: skram
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skram -d skram"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextjs:
    image: ${IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://skram:${POSTGRES_PASSWORD}@postgres:5432/skram
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      # AWS — SES (email) + S3 (file storage)
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS}
      S3_BUCKET_ASSETS: ${S3_BUCKET_ASSETS}
      S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS}
      CLOUDFLARE_CDN_URL: ${CLOUDFLARE_CDN_URL}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      AXIOM_TOKEN: ${AXIOM_TOKEN}
      AXIOM_DATASET: ${AXIOM_DATASET}
      PAYMENTS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  internal:
    driver: bridge

volumes:
  redis_data:
