---
- name: Create app directory
  file:
    path: /opt/skrammm
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create Postgres data directory
  file:
    path: /data/postgres
    state: directory
    owner: "70"   # postgres UID in postgres:16-alpine
    group: "70"
    mode: "0700"

- name: Copy docker-compose.yml
  copy:
    src: "{{ playbook_dir }}/../docker/docker-compose.yml"
    dest: /opt/skrammm/docker-compose.yml
    owner: "{{ ansible_user }}"
    mode: "0644"

- name: Copy postgres-init.sql
  copy:
    src: "{{ playbook_dir }}/../docker/postgres-init.sql"
    dest: /opt/skrammm/postgres-init.sql
    owner: "{{ ansible_user }}"
    mode: "0644"

- name: Verify /opt/skrammm/.env exists
  stat:
    path: /opt/skrammm/.env
  register: env_file

- name: Fail if .env is missing
  fail:
    msg: |
      /opt/skrammm/.env not found on the VPS.
      SSH in as {{ ansible_user }} and create it before running this playbook:
        mkdir -p /opt/skrammm
        nano /opt/skrammm/.env
      Use .env.example from the repo as a template. Include IMAGE=ghcr.io/sysemy-tech/skrammm:latest.
  when: not env_file.stat.exists

- name: Ensure .env is owned by deploy user
  file:
    path: /opt/skrammm/.env
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Create systemd service for docker-compose
  copy:
    dest: /etc/systemd/system/skrammm.service
    content: |
      [Unit]
      Description=Skrammm App
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/skrammm
      EnvironmentFile=/opt/skrammm/.env
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      TimeoutStartSec=300

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

- name: Reload systemd daemon
  systemd:
    daemon_reload: true

- name: Log in to GitHub Container Registry
  become_user: "{{ ansible_user }}"
  shell: echo "{{ cr_pat }}" | docker login ghcr.io -u {{ cr_username }} --password-stdin
  no_log: true

- name: Pull Docker images
  become_user: "{{ ansible_user }}"
  shell: docker compose pull
  args:
    chdir: /opt/skrammm
  changed_when: true

- name: Start and enable skrammm service
  systemd:
    name: skrammm
    enabled: true
    state: started

- name: Wait for Next.js health check
  uri:
    url: http://127.0.0.1:3000/api/health
    status_code: 200
  register: health
  retries: 12
  delay: 10
  until: health.status == 200
