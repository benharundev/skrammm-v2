---
- name: Install prerequisite packages
  apt:
    name: [ca-certificates, curl, gnupg, lsb-release]
    state: present
    update_cache: true

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker apt repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker Engine and Compose plugin
  apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true

- name: Start and enable Docker service
  systemd:
    name: docker
    enabled: true
    state: started

- name: Add deploy user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Create Docker config directory for deploy user
  file:
    path: "/home/{{ ansible_user }}/.docker"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Configure Docker auth for GHCR (uses CR_PAT env var)
  copy:
    dest: "/home/{{ ansible_user }}/.docker/config.json"
    content: |
      {
        "auths": {
          "ghcr.io": {
            "auth": "{{ (ansible_user + ':' + lookup('env', 'CR_PAT')) | b64encode }}"
          }
        }
      }
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
