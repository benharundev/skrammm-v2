---
- name: Install prerequisite packages
  apt:
    name: [ca-certificates, curl, gnupg, lsb-release]
    state: present
    update_cache: true

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker apt repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker Engine and Compose plugin
  apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true

- name: Start and enable Docker service
  systemd:
    name: docker
    enabled: true
    state: started

- name: Add deploy user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Install gcloud CLI (for Artifact Registry auth)
  shell: |
    curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir=/usr/local
    ln -sf /usr/local/google-cloud-sdk/bin/gcloud /usr/local/bin/gcloud
  args:
    creates: /usr/local/bin/gcloud
