---
- name: Install prerequisite packages
  apt:
    name: [ca-certificates, curl, gnupg, lsb-release]
    state: present
    update_cache: true

- name: Create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Engine and Compose plugin
  apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true

- name: Start and enable Docker service
  systemd:
    name: docker
    enabled: true
    state: started

- name: Add deploy user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Create Docker config directory for deploy user
  file:
    path: "/home/{{ ansible_user }}/.docker"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Configure Docker auth for GHCR (uses CR_PAT env var)
  copy:
    dest: "/home/{{ ansible_user }}/.docker/config.json"
    content: |
      {
        "auths": {
          "ghcr.io": {
            "auth": "{{ (ansible_user + ':' + lookup('env', 'CR_PAT')) | b64encode }}"
          }
        }
      }
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
