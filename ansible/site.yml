---
# Provision a fresh Ubuntu VPS on Shinjiru KVM for Skrammm.
#
# Pre-requisites (run once manually before this playbook):
#   1. SSH into VPS as root
#   2. adduser ubuntu && usermod -aG sudo ubuntu
#   3. ssh-copy-id -i ~/.ssh/skrammm_deploy.pub ubuntu@<VPS_IP>
#   4. sudo mkdir -p /opt/skrammm && sudo chown ubuntu:ubuntu /opt/skrammm
#   5. nano /opt/skrammm/.env && chmod 600 /opt/skrammm/.env  (fill all secrets)
#
# Run:      CR_PAT=ghp_xxx ansible-playbook -i inventory.yml site.yml -e "vps_ip=x.x.x.x" -e "vps_user=ubuntu"
# Dry-run:  CR_PAT=ghp_xxx ansible-playbook -i inventory.yml site.yml -e "vps_ip=x.x.x.x" --check

- name: Provision Skrammm production server
  hosts: skrammm_prod
  become: true

  vars:
    app_dir: /opt/skrammm
    data_dir: /data/postgres

  roles:
    - role: docker
    - role: nginx
    - role: ufw
    - role: app
